<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Café Food Ordering System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Campus Café Food Ordering System</h1>

<form id="orderForm">

<fieldset>

<legend>Customer Information</legend>

<label for="name">Full Name:</label>
<input type="text" id="name">
<span id="nameError"></span>

<br><br>

<label for="email">Email:</label>
<input type="email" id="email">
<span id="emailError"></span>

<br><br>

<label for="phone">Phone Number:</label>
<input type="text" id="phone">
<span id="phoneError"></span>

<br><br>

<label for="studentid">Student ID:</label>
<input type="text" id="studentid">
<span id="studentError"></span>

<br><br>

Gender :

<input type="radio" name="gender" value="Male">
<label>Male</label>

<input type="radio" name="gender" value="Female">
<label>Female</label>

<br>
<span id="genderError"></span>

<br><br>

<label for="department">Department:</label>

<select id="department">

<option value="">Select Department</option>

<option value="CSE">CSE</option>

<option value="EEE">EEE</option>

<option value="BBA">BBA</option>

<option value="English">English</option>

<option value="Other">Other</option>

</select>

<span id="departmentError"></span>

</fieldset>

<br>

<fieldset>

<legend>Food Selection</legend>

<input type="checkbox" class="food" value="Burger" data-price="5">
<label>Burger ($5)</label>

<br>

<input type="checkbox" class="food" value="Pizza" data-price="8">
<label>Pizza ($8)</label>

<br>

<input type="checkbox" class="food" value="Sandwich" data-price="4">
<label>Sandwich ($4)</label>

<br>

<input type="checkbox" class="food" value="French Fries" data-price="3">
<label>French Fries ($3)</label>

<br>

<input type="checkbox" class="food" value="Coffee" data-price="2">
<label>Coffee ($2)</label>

<br>

<input type="checkbox" class="food" value="Cold Drink" data-price="2">
<label>Cold Drink ($2)</label>

<br>

<span id="foodError"></span>

<br><br>

<label for="quantity">Quantity:</label>

<input type="number" id="quantity" min="1" value="1">

<span id="quantityError"></span>

<br><br>

<label for="instruction">Special Instructions:</label>

<textarea id="instruction" rows="5" cols="40"></textarea>

</fieldset>

<br>

<input type="submit" value="Place Order">

<input type="reset" value="Clear">

</form>

<br>

<fieldset>

<legend>Order Summary</legend>

<div id="output"></div>

</fieldset>

<script src="script.js"></script>

</body>
</html>
